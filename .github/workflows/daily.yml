name: daily

on:
  schedule:
    - cron: "0 15 * * *"   # 00:00 KST (GitHub may delay scheduled runs by hours)
  workflow_dispatch:
    inputs:
      sync_sources:
        description: "Re-parse curated sources and resync the registry"
        type: boolean
        default: false
      deploy_only:
        description: "Only rebuild and redeploy the site (no collection)"
        type: boolean
        default: false
  push:                      # page/code changes redeploy without collecting
    branches: [main]
    paths: ["index.html", "assets/**", "tf/**", "preview/**", "pyproject.toml", ".github/workflows/daily.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  collect:
    if: github.event_name != 'push' && !inputs.deploy_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen

      - name: Sync sources (Mondays KST, or on demand)
        run: |
          if [ "${{ inputs.sync_sources }}" = "true" ] || [ "$(date +%u)" = "1" ]; then
            uv run python -m tf.sources
          else
            echo "not Monday; skipping source sync"
          fi

      - name: Discover new repos (>= 5k stars; topic search Mondays, trending daily)
        run: |
          if [ "${{ inputs.sync_sources }}" = "true" ] || [ "$(date +%u)" = "1" ]; then
            uv run python -m tf.discover
          else
            uv run python -m tf.discover --trending-only
          fi

      - name: Collect stars
        run: uv run python -m tf.collect

      - name: Build trending.json
        run: uv run python -m tf.build

      - name: Test
        run: uv run pytest -q

      - name: Weekly digest (Mondays KST, full 7-day window only)
        run: |
          if [ "$(date +%u)" = "1" ]; then
            uv run python -m tf.publish digest | tee "$RUNNER_TEMP/digest_path"
          fi

      - name: Gate
        run: uv run python -m tf.gate

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: $(date +%F)"
          git push

      - name: Publish digest as a release (emails release watchers)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(cat "$RUNNER_TEMP/digest_path" 2>/dev/null || true)
          if [ -z "$f" ] || [ ! -f "$f" ]; then echo "no digest this run"; exit 0; fi
          tag="digest-$(basename "$f" .md)"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          gh release create "$tag" --title "$(head -1 "$f" | sed 's/^# //')" --notes-file "$f" --latest

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-gate --color B60205 --description "Daily data run failed" 2>/dev/null || true
          gh issue create --label data-gate \
            --title "Daily data run failed: $(date +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  skills:
    # skills.sh installs. Runs after the repo data is pushed and fails independently of it:
    # a skills.sh outage opens its own issue and the site still deploys with the last skills data.
    needs: collect
    if: ${{ !cancelled() && github.event_name != 'push' && !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main            # include the repo data commit from the collect job
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen

      - name: Restore raw skill snapshots (skills-raw branch)
        run: |
          mkdir -p raw
          if git fetch --depth 1 origin skills-raw; then
            git archive FETCH_HEAD | tar -x -C raw
          else
            echo "no skills-raw branch yet; starting fresh"
          fi

      - name: Collect skills.sh (all-time + trending, ~100 paced requests)
        run: uv run python -m tf.skills collect

      - name: Build skills.json and today's display snapshot
        run: uv run python -m tf.skills build --snapshot

      - name: Gate
        run: uv run python -m tf.skills gate

      - name: Push raw snapshots (skills-raw = one commit holding the last 30 days)
        run: |
          cd raw
          git init -q -b skills-raw
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "raw: $(date +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:skills-raw

      - name: Commit display snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skills
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "skills: $(date +%F)"
          git pull --rebase -q origin main
          git push

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create skills-gate --color 7A5CF0 --description "Daily skills.sh run failed" 2>/dev/null || true
          gh issue create --label skills-gate \
            --title "Daily skills run failed: $(date +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: [collect, skills]
    if: ${{ !cancelled() && needs.collect.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main            # pick up the data commits pushed by the collect and skills jobs
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen

      - name: Restore raw skill snapshots (skills-raw branch)
        run: |
          mkdir -p raw
          git fetch --depth 1 origin skills-raw && git archive FETCH_HEAD | tar -x -C raw || echo "no skills-raw branch"

      - name: Build site
        id: build
        run: |
          if ! compgen -G "data/snapshots/*.json" > /dev/null; then
            echo "no snapshots yet; keeping the current deployment"
            exit 0
          fi
          if compgen -G "raw/all-time/*.json.gz" > /dev/null || compgen -G "data/skills/*.json" > /dev/null; then
            # before tf.build (repo rows link to their skills); preview data until 2 production days exist
            uv run python -m tf.skills build --preview-dir preview/skills
          fi
          uv run python -m tf.build
          mkdir -p _site/data
          cp -r index.html assets _site/
          v=$(git rev-parse --short HEAD)
          sed -i "s#assets/app.js#assets/app.js?v=$v#; s#assets/style.css#assets/style.css?v=$v#" _site/index.html
          cp data/trending.json _site/data/
          if [ -f data/skills.json ]; then cp data/skills.json _site/data/; fi
          uv run python -m tf.publish feed --out _site/feed.xml
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - if: steps.build.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - if: steps.build.outputs.ok == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
